name: analyze-test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Flutter's action cache saves the SDK. contents stays read-only.
  actions: write

# Cancel superseded PR runs only. Pushes to main are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Storage token scoping test requires gaxios and must fail, not
      # skip, when that package is missing.
      - name: install script dependencies
        run: npm ci --prefix scripts

      - name: state batch and index checks
        run: node --test scripts/state_batch.test.js scripts/rebuild_index.test.js scripts/resize_cover_thumbs.test.js scripts/audit_coords.test.js scripts/backfill_cover_photos.test.js scripts/clear_placeholder_covers.test.js scripts/no_public_acl.test.js scripts/download_token.test.js scripts/redact_url.test.js

      - name: photo patch checks
        run: node --test scripts/photo_patch.test.js

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # Local Firestore emulator only. demo-* never reaches production.
      - name: temple index emulator rules
        run: |
          scripts/node_modules/.bin/firebase emulators:exec --only firestore --project demo-temple-index "node --test scripts/temple_index_rules.test.js && node --test --test-name-pattern \"existing meta and shard|would pass 400|temple id exists\" scripts/state_batch.test.js"

      # Own emulator and project so leftover rules-test documents cannot
      # change the read counts.
      - name: temple index read counts
        run: |
          scripts/node_modules/.bin/firebase emulators:exec --only firestore --project demo-temple-index-reads "node --test scripts/index_read_count.test.js"

      # No upload key in CI. This exercises the guards, not a signed AAB.
      # The demo distribution check does not build an APK or call Firebase.
      - name: Play AAB guard
        run: |
          bash scripts/test_play_aab_guard.sh
          bash scripts/ci/test_ci_guards.sh
          bash scripts/ci/test_demo_distribution_guard.sh

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
