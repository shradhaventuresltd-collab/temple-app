name: actions-minutes

# Weekly check against the 2,000 free private Actions minutes.
# The total is analyze-test minutes plus android-smoke minutes.
# At or above 1,500 the issue says to change android-smoke to
# cron '30 4,16 * * *' (10:00 and 22:00 IST). The smoke schedule
# itself stays four runs a day. See scripts/ci/check_actions_minutes.sh.
#
# Minutes come from each job's started_at and completed_at. The run
# timing API and /settings/billing/usage are not called. An API error
# fails the job, as does a workflow that has runs but totals 0 minutes.

on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check Actions minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check_actions_minutes.sh
