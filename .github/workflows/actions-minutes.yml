name: actions-minutes

# Weekly check of this repository's minutes against the 2,000 free
# private Actions minutes. Those 2,000 minutes are shared across the
# account. Other repositories use the same quota and are not included.
# The total is every workflow the Actions API lists, including
# demo-seed-launch.yml and this workflow.
# At or above 1,500 the issue text still says to change android-smoke
# to cron '30 4,16 * * *' (10:00 and 22:00 IST). The smoke schedule in
# android-smoke.yml is weekly (cron '30 4 * * 1'). See
# scripts/ci/check_actions_minutes.sh.
#
# Minutes come from each job's started_at and completed_at. The run
# timing API and /settings/billing/usage are not called. An API error
# fails the job, as does a workflow that has runs but totals 0 minutes.

on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check Actions minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check_actions_minutes.sh
