name: android-smoke

# Main batch only. Pull requests run analyze-test (KAN-90's required check).
# There is no pull_request trigger and no push trigger.
#
# Schedule is 10:00, 17:00, 22:00, and 05:00 IST (UTC+5:30):
#   30 4,11,16,23 * * *
# workflow_dispatch runs even when main HEAD is already green.
# A scheduled run is skipped when main HEAD equals the last successful
# android-smoke job. The optional "run after 3 merges" push trigger was
# not added.

on:
  schedule:
    - cron: '30 4,11,16,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Gradle, AVD, system-image, and Flutter caches, plus the Maestro debug artifact.
  actions: write
  issues: write

# This workflow does not run on pull requests. cancel-in-progress stays
# limited to pull_request so a later PR trigger cannot cancel a main batch,
# and scheduled or dispatched runs are not cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skip-if-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      last_green_sha: ${{ steps.decide.outputs.last_green_sha }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/android_smoke_plan.sh

  android-smoke:
    needs: skip-if-unchanged
    if: needs.skip-if-unchanged.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # Pub cache: subosito/flutter-action cache: true.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Profile starts much faster than debug on a cold emulator, and
      # x86_64 matches the AVD. DEMO_BUILD forces test ad units. Do not
      # pass ENABLE_ADMIN_TOOLS. The Maestro flow never taps Seed or Admin.
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Build profile APK
        run: flutter build apk --profile --target-platform android-x64 --dart-define=DEMO_BUILD=true

      - name: Install Maestro 2.11.0
        run: |
          version=2.11.0
          expected=5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
          curl -fsSL -o "${RUNNER_TEMP}/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${version}/maestro.zip"
          echo "${expected}  ${RUNNER_TEMP}/maestro.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/maestro.zip" -d "${RUNNER_TEMP}/maestro-dist"
          rm -rf "${HOME}/.maestro"
          mv "${RUNNER_TEMP}/maestro-dist/maestro" "${HOME}/.maestro"
          chmod +x "${HOME}/.maestro/bin/maestro"
          echo "${HOME}/.maestro/bin" >> "$GITHUB_PATH"
          "${HOME}/.maestro/bin/maestro" --version

      # System image the emulator runner installs under ANDROID_SDK_ROOT.
      - name: Cache emulator system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: system-image-android-34-google_apis-x86_64

      # reactivecircus/android-emulator-runner snapshot pattern: cache the
      # AVD, boot once without -no-snapshot-save on a miss, then smoke with
      # -no-snapshot-save so the cached snapshot is not rewritten.
      - name: Cache AVD
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-pixel6-snapshot

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: temple-smoke-34-pixel6
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: echo "Generated AVD snapshot for caching."

      - name: Maestro smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: temple-smoke-34-pixel6
          force-avd-creation: false
          disable-animations: true
          # Deterministic software GPU: no snapshot save, no boot animation.
          # The smoke script also waits for sys.boot_completed and
          # installs the APK with adb before Maestro.
          emulator-options: -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect -no-window -noaudio -camera-back none -camera-front none
          # One dash-safe command. The action runs this with /usr/bin/sh.
          script: bash scripts/ci/run_android_smoke.sh

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug
          path: maestro-debug
          if-no-files-found: ignore

  report-failure:
    needs: [skip-if-unchanged, android-smoke]
    if: always() && needs.android-smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Open or update the smoke-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_GREEN_SHA: ${{ needs.skip-if-unchanged.outputs.last_green_sha }}
          FAILING_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/report_smoke_failure.sh
