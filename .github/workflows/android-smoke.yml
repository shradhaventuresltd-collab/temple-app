name: android-smoke

# Schedule and workflow_dispatch stay the main batch. There is no push trigger.
# A push trigger that would run smoke after three merges was not added.
#
# Schedule is 10:00, 17:00, 22:00, and 05:00 IST (UTC+5:30):
#   30 4,11,16,23 * * *
# workflow_dispatch always runs the emulator.
# A scheduled run is skipped when main HEAD equals the last successful
# android-smoke job on main, or the last failed attempt, so a red SHA is
# not retried every slot. A schedule-triggered cancelled job counts as
# failed, including a manual cancel of that scheduled run. That SHA stays
# blocked until a new commit or a workflow_dispatch. A workflow_dispatch
# cancel does not.
#
# pull_request is opt-in. types are labeled and synchronize only.
# The emulator job runs only when the PR has the run-smoke label:
#   contains(github.event.pull_request.labels.*.name, 'run-smoke')
# A labeled event also requires github.event.label.name == 'run-smoke',
# so adding any other label does not start smoke. synchronize runs only
# while that label is already present. The plan job does not apply the
# green/failed SHA skip on pull_request. After a green pull_request
# android-smoke job, remove-run-smoke-label deletes run-smoke so a later
# push does not start another run. That job's only permission is
# pull-requests: write. If the token cannot delete the label, the job
# warns and exits 0; remove it with:
#   gh pr edit <number> --remove-label run-smoke

on:
  schedule:
    - cron: '30 4,11,16,23 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

# One group per pull request. cancel-in-progress is true only for
# pull_request, so a new push or a re-label cancels that PR's smoke and
# cannot cancel a scheduled or dispatched main batch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skip-if-unchanged:
    # Schedule and dispatch always plan. A pull request plans only with the
    # run-smoke label, and a labeled event only when that label was the one added.
    if: >-
      github.event_name != 'pull_request' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-smoke') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'run-smoke'
        )
      )
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      last_green_sha: ${{ steps.decide.outputs.last_green_sha }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/android_smoke_plan.sh

  android-smoke:
    needs: skip-if-unchanged
    if: >-
      needs.skip-if-unchanged.outputs.should_run == 'true' &&
      (
        github.event_name != 'pull_request' ||
        (
          contains(github.event.pull_request.labels.*.name, 'run-smoke') &&
          (
            github.event.action != 'labeled' ||
            github.event.label.name == 'run-smoke'
          )
        )
      )
    permissions:
      contents: read
      # Gradle, AVD, system-image, and Flutter caches, plus the Maestro debug artifact.
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # $SECONDS inside the smoke script starts when that script starts, after
      # the APK build. Screenshot decisions use this job clock instead.
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: bash scripts/ci/free_runner_disk.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # Pub cache: subosito/flutter-action cache: true.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Profile keeps the committed -Xmx8G. On 8f50ccd that daemon left
      # about 3.6GiB available and an empty swap. Capping it at 3g stretched
      # this build from about 2 minutes to 3m50s and the 15-minute job
      # then cancelled Maestro. The release build in demo-seed-launch is
      # the one that fills RAM, and that workflow caps the heap.

      # Profile starts much faster than debug on a cold emulator, and
      # x86_64 matches the AVD. DEMO_BUILD forces test ad units. Do not
      # pass ENABLE_ADMIN_TOOLS. The Maestro flow never taps Seed or Admin.
      - name: Cache Gradle
        id: gradle-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          # build.gradle.kts is in that hash. The demo suffix does not change
          # dependencies, so a primary miss still restores the previous cache.
          restore-keys: gradle-

      # Flutter 3.47.7 asks for NDK side-by-side 28.2.13676358. Free-disk
      # removes the image's other NDKs; this restores the one the build uses.
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358

      - name: Build profile APK
        run: flutter build apk --profile --target-platform android-x64 --dart-define=DEMO_BUILD=true

      - name: Install Maestro 2.11.0
        run: |
          version=2.11.0
          expected=5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
          curl -fsSL -o "${RUNNER_TEMP}/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${version}/maestro.zip"
          echo "${expected}  ${RUNNER_TEMP}/maestro.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/maestro.zip" -d "${RUNNER_TEMP}/maestro-dist"
          rm -rf "${HOME}/.maestro"
          mv "${RUNNER_TEMP}/maestro-dist/maestro" "${HOME}/.maestro"
          chmod +x "${HOME}/.maestro/bin/maestro"
          echo "${HOME}/.maestro/bin" >> "$GITHUB_PATH"
          "${HOME}/.maestro/bin/maestro" --version

      # System image the emulator runner installs under ANDROID_SDK_ROOT.
      # restore + save, not the combined action: its post step runs only
      # when the job succeeds, and a cold miss must still be saved if a
      # later step fails. Key is API 34, ABI x86_64, image google_atd.
      - name: Restore emulator system image
        id: system-image-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: system-image-android-34-google_atd-x86_64

      # Key is API 34, ABI x86_64, image google_atd (pixel_6 snapshot).
      # A hit keeps the run near 8 minutes.
      # reactivecircus/android-emulator-runner snapshot pattern: cache the
      # AVD, boot once without -no-snapshot-save on a miss, then smoke with
      # -no-snapshot-save so the cached snapshot is not rewritten.
      - name: Restore AVD
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_atd-pixel6-snapshot

      # gradle.properties sets -Xmx8G and the daemon stays up after the APK
      # build. The emulator then raises guest RAM to 2560MB. On the hosted
      # runner those two together tore down demo-seed-launch while it was
      # loading the AVD snapshot. Stop the daemon before any emulator boot.
      - name: Stop Gradle before the emulator
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f 'KotlinCompileDaemon|kotlin-compiler-daemon|GradleDaemon' || true
          echo "===== df before emulator ====="
          df -h
          free -h
          echo "nproc=$(nproc)"
          if [[ "$(nproc)" -ge 4 ]]; then
            echo "EMULATOR_CORES=4" >> "$GITHUB_ENV"
          else
            echo "EMULATOR_CORES=2" >> "$GITHUB_ENV"
          fi
          echo "NDK_CACHE_HIT=${{ steps.ndk-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
          echo "GRADLE_CACHE_HIT=${{ steps.gradle-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

      - name: Create AVD snapshot for caching
        id: create-avd
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_atd
          # main's AVD profile is pixel_6. It is not a smaller device.
          # disk-size caps userdata at 2048M; the profile default is ~7GB
          # and the runner does not have that free after the APK build.
          profile: pixel_6
          cores: ${{ env.EMULATOR_CORES }}
          disk-size: 2048M
          avd-name: temple-smoke-34-atd
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -camera-front none -partition-size 2048
          pre-emulator-launch-script: bash scripts/ci/prepare_atd_avd.sh temple-smoke-34-atd
          script: echo "Generated AVD snapshot for caching."

      - name: Maestro smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          # google_atd keeps Play services (Firebase, ads) and drops the
          # launcher and System UI that were ANRing on google_apis.
          target: google_atd
          profile: pixel_6
          cores: ${{ env.EMULATOR_CORES }}
          disk-size: 2048M
          avd-name: temple-smoke-34-atd
          force-avd-creation: false
          disable-animations: true
          # Deterministic software GPU, animations off, no audio.
          # Cores follow nproc (4 on the hosted runner).
          # -no-snapshot-load keeps this job off a snapshot taken while the
          # guest was still settling. The smoke script waits for
          # sys.boot_completed and installs the APK with adb.
          pre-emulator-launch-script: bash scripts/ci/prepare_atd_avd.sh temple-smoke-34-atd
          emulator-options: -no-snapshot-save -no-snapshot-load -no-boot-anim -gpu swiftshader_indirect -no-window -no-audio -camera-back none -camera-front none -partition-size 2048
          # One dash-safe command. The action runs this with /usr/bin/sh.
          # Setup usually takes about 6 to 7 minutes, so the 15-minute job
          # limit fires before this 12-minute shell timeout and the job
          # concludes cancelled. A scheduled cancel counts as failed.
          # --kill-after sends SIGKILL if the shell timeout is reached.
          script: timeout --kill-after=30s 12m bash scripts/ci/run_android_smoke.sh

      - name: Save emulator system image
        if: always() && steps.system-image-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: system-image-android-34-google_atd-x86_64

      - name: Save AVD
        if: always() && steps.avd-cache.outputs.cache-hit != 'true' && steps.create-avd.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_atd-pixel6-snapshot

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug
          path: maestro-debug
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore

  report-failure:
    needs: [skip-if-unchanged, android-smoke]
    # Schedule and workflow_dispatch only. A pull_request failure must not
    # open or comment on the smoke-failure issue.
    if: >-
      always() &&
      github.event_name != 'pull_request' && (
        needs.android-smoke.result == 'failure' ||
        needs.skip-if-unchanged.result == 'failure' ||
        (
          github.event_name == 'schedule' && (
            needs.android-smoke.result == 'cancelled' ||
            needs.skip-if-unchanged.result == 'cancelled'
          )
        )
      )
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Open or comment on the smoke-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_GREEN_SHA: ${{ needs.skip-if-unchanged.outputs.last_green_sha }}
          FAILING_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/report_smoke_failure.sh

  # Runs only after a green pull_request smoke. Removing the label stops a
  # later synchronize event from starting another emulator. unlabeled is not
  # a workflow trigger, so this delete does not start a new run. A failed
  # smoke keeps the label so the next push can retry.
  remove-run-smoke-label:
    needs: android-smoke
    if: >-
      github.event_name == 'pull_request' &&
      needs.android-smoke.result == 'success'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the run-smoke label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          err="$(gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/run-smoke" \
            2>&1)"
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "Removed run-smoke from pull request ${PR_NUMBER}."
            exit 0
          fi
          if printf '%s' "$err" | grep -Eq '404|Not Found'; then
            echo "run-smoke is already absent from pull request ${PR_NUMBER}."
            exit 0
          fi
          echo "::warning::Could not remove the run-smoke label from pull request ${PR_NUMBER}. The token may lack pull-requests: write. Remove it manually so the next push does not start smoke: gh pr edit ${PR_NUMBER} --remove-label run-smoke"
          printf '%s\n' "$err"
          exit 0
