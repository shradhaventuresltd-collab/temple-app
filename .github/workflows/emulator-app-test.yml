          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          pre-emulator-launch-script: ${{ env.EMULATOR_PRE_LAUNCH }}
          script: bash tool/emulator/run_one_flow.sh 12-ads tool/emulator/flows/12_ads.sh

      - name: Flow 13 licences
        if: ${{ !cancelled() && steps.resolve-apk.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          cores: ${{ env.EMULATOR_CORES }}
          disk-size: ${{ env.EMULATOR_DISK_SIZE }}
          avd-name: ${{ env.EMULATOR_AVD_NAME }}
          force-avd-creation: ${{ env.EMULATOR_FORCE_AVD_CREATION }}
          disable-animations: ${{ env.EMULATOR_DISABLE_ANIMATIONS }}
