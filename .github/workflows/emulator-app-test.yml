          script: bash tool/emulator/run_one_flow.sh 05-search tool/emulator/flows/05_search.sh

      - name: Flow 06 filters
        if: ${{ !cancelled() && steps.resolve-apk.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          cores: ${{ env.EMULATOR_CORES }}
          disk-size: ${{ env.EMULATOR_DISK_SIZE }}
          avd-name: ${{ env.EMULATOR_AVD_NAME }}
