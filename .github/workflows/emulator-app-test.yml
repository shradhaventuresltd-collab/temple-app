      - name: Flow 07 district filter
        if: ${{ !cancelled() && steps.resolve-apk.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
