appId: com.shradhaventures.temple
---
# Read-only screenshots. Never taps Seed, Admin, or Get Directions.
# Every block is optional so a miss does not fail the smoke gate.
# The shell also ignores this flow's exit code.

- launchApp
# The smoke gate accepts Terms on a clearState launch. This launch keeps
# that acceptance. If the gate is still up, accept it before Home.
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    optional: true
    commands:
      - tapOn:
          text: "Wait"
          optional: true
      - tapOn:
          text: "Close app"
          optional: true
- extendedWaitUntil:
    visible:
      id: "policy-accept-button"
    timeout: 20000
    optional: true
- tapOn:
    id: "policy-accept-button"
    optional: true
- extendedWaitUntil:
    visible: "Temple Directory"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible: "India's Sacred Temples"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
    optional: true
- runFlow:
    when:
      visible: "India's Sacred Temples"
    optional: true
    commands:
      - takeScreenshot:
          path: 01-home

- scrollUntilVisible:
    element:
      id: "home-browse-temples"
    direction: DOWN
    timeout: 15000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
    optional: true
- tapOn:
    id: "home-browse-temples"
    optional: true
- extendedWaitUntil:
    visible:
      id: "temple-browse-card"
    timeout: 8000
    optional: true
- takeScreenshot:
    path: 02-browse
    optional: true

- tapOn:
    id: "filter-chip-state"
    optional: true
- extendedWaitUntil:
    visible: "Filters"
    timeout: 8000
    optional: true
- takeScreenshot:
    path: 03-filters
    optional: true
- back:
    optional: true

# Search by name, shoot the top of detail, scroll once, go back.
- runFlow:
    optional: true
    commands:
      - tapOn:
          id: "temple-list-search-field"
      - eraseText:
          optional: true
      - inputText: "Dilwara"
      - hideKeyboard:
          optional: true
      - extendedWaitUntil:
          visible: "\\d+ temples?"
          timeout: 8000
      - tapOn:
          id: "temple-browse-card"
      # Every third open shows a test interstitial. Dismiss it before the shot.
      - extendedWaitUntil:
          visible: "Test mode|Get Directions"
          timeout: 2000
          optional: true
      - runFlow:
          when:
            visible: "Test mode"
          optional: true
          commands:
            - tapOn:
                point: "92%,7%"
            - tapOn:
                text: "Close"
                optional: true
      - extendedWaitUntil:
          visible: ".*Dilwara.*"
          timeout: 8000
      - takeScreenshot:
          path: 04-detail-dilwara
      - scroll
      - takeScreenshot:
          path: 05-detail-dilwara-scrolled
      - back
- runFlow:
    optional: true
    commands:
      - tapOn:
          id: "temple-list-search-field"
      - eraseText:
          optional: true
      - inputText: "Mahabodhi"
      - hideKeyboard:
          optional: true
      - extendedWaitUntil:
          visible: "\\d+ temples?"
          timeout: 8000
      - tapOn:
          id: "temple-browse-card"
      - extendedWaitUntil:
          visible: "Test mode|Get Directions"
          timeout: 2000
          optional: true
      - runFlow:
          when:
            visible: "Test mode"
          optional: true
          commands:
            - tapOn:
                point: "92%,7%"
            - tapOn:
                text: "Close"
                optional: true
      - extendedWaitUntil:
          visible: ".*Mahabodhi.*"
          timeout: 8000
      - takeScreenshot:
          path: 06-detail-mahabodhi
      - scroll
      - takeScreenshot:
          path: 07-detail-mahabodhi-scrolled
      - back
- runFlow:
    optional: true
    commands:
      # The list counts opens in memory and shows a test interstitial
      # on every third tap. Home pops back to the first route so the
      # next list starts at 0. System back only clears search focus.
      - tapOn:
          id: "temple-list-home"
      - scrollUntilVisible:
          element:
            id: "home-browse-temples"
          direction: DOWN
          timeout: 8000
          speed: 40
          visibilityPercentage: 100
          centerElement: true
      - tapOn:
          id: "home-browse-temples"
      - extendedWaitUntil:
          visible:
            id: "temple-list-search-field"
          timeout: 8000
      - tapOn:
          id: "temple-list-search-field"
      - eraseText:
          optional: true
      - inputText: "Martand Sun Temple"
      - hideKeyboard:
          optional: true
      # "Martand" also matches Jejuri Khandoba: its address is
      # "Shri Martand Dev Sansthan...". The full name matches one
      # temple, and the count node is then exactly "1 temple".
      # The card merges name, place, and deity, so a bare-name tap
      # does not select it.
      - extendedWaitUntil:
          visible: "1 temple"
          timeout: 8000
      - tapOn:
          id: "temple-browse-card"
      - extendedWaitUntil:
          visible: "Test mode|Get Directions"
          timeout: 2000
          optional: true
      - runFlow:
          when:
            visible: "Test mode"
          optional: true
          commands:
            - tapOn:
                point: "92%,7%"
            - tapOn:
                text: "Close"
                optional: true
      - extendedWaitUntil:
          notVisible:
            id: "temple-list-search-field"
          timeout: 8000
      - extendedWaitUntil:
          visible: "Martand Sun Temple"
          timeout: 8000
      - takeScreenshot:
          path: 08-detail-martand
      - scroll
      - takeScreenshot:
          path: 09-detail-martand-scrolled
      - back
