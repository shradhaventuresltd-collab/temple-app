appId: com.shradhaventures.temple
---
# Read-only smoke against prod Firebase (or the bundled sample fallback).
# Never taps Seed, Admin sign-in, or Admin Panel.
# Get Directions must leave this app: Maps, a browser, a chooser, or the
# CI https handoff stub. Staying on the button fails the flow.

- launchApp
# Profile still needs a long first-frame wait on a cold emulator.
# Any of these means Flutter has drawn past the native splash.
- extendedWaitUntil:
    visible: "Temple Directory|Loading temples|Browse "
    timeout: 180000
- scrollUntilVisible:
    element:
      id: "home-browse-temples"
    direction: DOWN
    timeout: 90000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "home-browse-temples"
- extendedWaitUntil:
    visible:
      id: "temple-browse-card"
    timeout: 30000
- assertVisible:
    id: "temple-list-search-field"
- tapOn:
    id: "temple-list-search-field"
- inputText: "Meenakshi"
- pressKey: Enter
# The card's accessibility text is the name plus place and deity, so a
# bare name match does not see it. "1 temple" is the filtered count.
- hideKeyboard
- extendedWaitUntil:
    visible: "1 temple"
    timeout: 45000
- tapOn:
    id: "temple-browse-card"
- scrollUntilVisible:
    element:
      id: "get-directions-button"
    direction: DOWN
    timeout: 40000
    speed: 60
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "get-directions-button"
- extendedWaitUntil:
    notVisible:
      id: "get-directions-button"
    timeout: 20000
